name: Refresh coverage after merge

# COVERAGE.md aggregates GLOBAL_ASM ownership across the whole tree, so its
# content depends on every merged PR, not just one. The old design computed
# it per-PR and committed it onto each PR branch before allowing auto-merge;
# since two PRs open at the same time each proposed a different COVERAGE.md
# against a common ancestor, whichever merged first made every other open
# PR's copy conflict with the new master on that file, even when their real
# source changes touched disjoint fragments (for example
# https://github.com/michiiik/pokestadium/pull/23). Keeping the refresh out
# of PR branches entirely removes that whole class of self-inflicted
# conflict.
#
# This still can't push straight to master: master requires the "Validate
# ROM against master" status check, which only pull_request events ever
# produce, and branch protection rejects a direct push regardless of who
# or what makes it (confirmed the hard way -- see the GH006 failures on
# earlier runs of this workflow). So this opens a PR on a fixed branch
# instead and lets the normal pipeline take it from there: pr-rom-gate.yml
# and pr-integration.yml's integrate job both trust this specific bot on
# this specific branch name (see the comments there) and arm auto-merge
# exactly as they would for any other eligible PR.
on:
  # Hourly instead of after every merge: each refresh is a PR that needs a
  # "Validate ROM against master" run on the single self-hosted runner, and a
  # busy day merges dozens of changes. One refresh per hour (and none when
  # nothing changed) keeps those runs from queueing behind real PRs.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-refresh-coverage
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate COVERAGE.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Check the integration GitHub App configuration
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.PUBLIC_CI_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PUBLIC_CI_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure PUBLIC_CI_APP_ID and PUBLIC_CI_APP_PRIVATE_KEY before refreshing coverage.'
            exit 1
          fi

      - name: Create the least-privilege coverage App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLIC_CI_APP_ID }}
          private-key: ${{ secrets.PUBLIC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Regenerate COVERAGE.md and open/update its PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          python3 ci/update_coverage.py --repo-root .
          python3 ci/update_undocumented.py --repo-root .

          if git diff --quiet -- COVERAGE.md UNDOCUMENTED.md && [ -z "$(git ls-files --others --exclude-standard -- UNDOCUMENTED.md)" ]; then
            echo 'refresh-coverage: COVERAGE.md and UNDOCUMENTED.md are already current on master.'
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name 'pokestadium-public-ci[bot]'
          git config user.email 'pokestadium-public-ci[bot]@users.noreply.github.com'
          # An open refresh PR that already carries this exact content needs no
          # new commit: pushing one would cancel its queued gate run and send
          # it to the back of the queue.
          if git fetch --quiet --depth=1 origin ci/refresh-coverage 2>/dev/null \
              && git show FETCH_HEAD:COVERAGE.md | cmp -s - COVERAGE.md \
              && git show FETCH_HEAD:UNDOCUMENTED.md 2>/dev/null | cmp -s - UNDOCUMENTED.md; then
            echo 'refresh-coverage: ci/refresh-coverage already has these files; nothing to push.'
            exit 0
          fi

          git checkout -B ci/refresh-coverage
          git add COVERAGE.md UNDOCUMENTED.md
          git commit --quiet -m 'ci: refresh COVERAGE.md'
          git push --force origin ci/refresh-coverage

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head ci/refresh-coverage --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head ci/refresh-coverage \
              --title 'ci: refresh COVERAGE.md' \
              --body 'Automated, whole-tree regeneration from ci/update_coverage.py and ci/update_undocumented.py. Touches only COVERAGE.md and UNDOCUMENTED.md.'
            echo 'refresh-coverage: opened a new PR; pr-rom-gate.yml and the integrate job take it from here.'
          else
            echo "refresh-coverage: updated the existing PR #$existing; its gate will re-run automatically."
          fi
