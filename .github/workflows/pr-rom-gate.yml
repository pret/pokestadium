name: Public PR ROM Gate

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Public PR number to validate using its GitHub merge ref
        required: false

      ref:
        description: Same-repository branch or SHA when no PR number is supplied
        required: false
        default: master
      regions:
        description: >-
          Space-separated ROM versions to build (e.g. "jp eu"), or "all".
          Empty = the versions the PR/ref actually affects (US for a bare ref).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A `labeled` run gets its own group so that adding any label to a PR can
  # never cancel that PR's in-flight gate (the label runs are skipped for
  # everything except the approval label below).
  group: public-pr-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || inputs.ref || github.run_id }}${{ github.event.action == 'labeled' && '-label' || '' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Validate ROM against master
    # Required status checks can never be satisfied by a direct push to
    # master (see refresh-coverage.yml), so that job opens a PR instead.
    # Its bot has author_association NONE like any GitHub App, so trust it
    # narrowly: same-repo only, and only on the one fixed branch name that
    # workflow ever pushes to. Its content is always deterministically
    # regenerated from master's own already-trusted source, never from
    # PR-supplied input.
    # Draft PRs are skipped; marking one ready runs the gate (ready_for_review).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        (
          github.event.pull_request.user.login == 'pokestadium-public-ci[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'ci/refresh-coverage'
        ) ||
        (
          # A maintainer reviewed an outside contributor's diff and added the
          # approval label. Only the `labeled` event for that label counts, so
          # a later push (synchronize) never runs on a stale approval; the
          # steps below pin the exact commit and refuse build-tooling changes.
          github.event.action == 'labeled' &&
          github.event.label.name == 'gate-approved' &&
          contains(github.event.pull_request.labels.*.name, 'gate-approved')
        )
      )
    # This label is intentionally different from the private repository's
    # Stadium 1 label. Register it only on a dedicated, credential-free Mac
    # runner after the public baseline image has been built.
    runs-on: [self-hosted, macOS, ARM64, pokestadium-decomp-public]
    timeout-minutes: 150
    steps:
      - name: Mask self-hosted runner paths
        shell: bash
        run: |
          echo "::add-mask::${HOME}"
          echo "::add-mask::${GITHUB_WORKSPACE}"
          echo "::add-mask::${RUNNER_TEMP}"

      - name: Checkout the PR merge ref or selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || inputs.ref }}
          # The merge commit and its first parent, for the diffs below.
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false

      - name: Guard approved outside-contributor PRs
        # Only for the label path. The gate scripts run from the checked-out
        # tree, so an outside PR must not be able to change them, and the run
        # must build exactly the commit that was reviewed.
        if: >-
          github.event_name == 'pull_request' &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
          github.event.pull_request.user.login != 'pokestadium-public-ci[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::The PR changed after it was approved (HEAD is not $GITHUB_SHA). Remove and re-add the gate-approved label after reviewing the new commits."
            exit 1
          fi
          blocked="$(git diff --name-only HEAD^1 HEAD | grep -E '^(ci/|tools/|\.github/|Makefile$|requirements\.txt$|\.gitmodules$|\.gitattributes$)' || true)"
          if [ -n "$blocked" ]; then
            echo "::error::Outside PRs that change build tooling cannot use the approval label; a maintainer must run it from a branch in this repository. Changed:"
            echo "$blocked"
            exit 1
          fi

      - name: Detect a coverage-only diff
        id: coverage-only
        # refresh-coverage.yml opens/updates a PR (ci/refresh-coverage) whose
        # entire diff is always exactly COVERAGE.md, regenerated
        # deterministically from master's own already-trusted source. That
        # PR still needs a real "Validate ROM against master" status to
        # satisfy branch protection, but there is nothing in it that could
        # ever affect the ROM, so compare the PR's whole base...head diff
        # (not just this push) and skip the build whenever it is exactly
        # that one file -- for any pull_request action, not just
        # synchronize, since a freshly opened PR needs this just as much.
        # The job still runs and reports a real status either way, so a
        # required-status-check on this workflow is never left pending.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # The checkout is the PR merge commit, so its first parent is the
          # base tip and HEAD^1..HEAD is exactly what this PR adds. Diffing
          # base.sha against head.sha directly would also list, reversed,
          # every file master changed since the PR branched.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if [ "$changed" = "COVERAGE.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "pr-rom-gate: PR diff touches only COVERAGE.md; skipping the full rebuild" >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select the affected ROM versions
        id: regions
        if: steps.coverage-only.outputs.skip != 'true'
        shell: bash
        env:
          INPUT_REGIONS: ${{ inputs.regions }}
        run: |
          set -euo pipefail
          if [ "$INPUT_REGIONS" = "all" ]; then
            regions="$(python3 ci/affected_versions.py <<< "Makefile" | tr '\n' ' ')"
          elif [ -n "$INPUT_REGIONS" ]; then
            regions="$INPUT_REGIONS"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            regions="$(git diff --name-only HEAD^1 HEAD | python3 ci/affected_versions.py | tr '\n' ' ')"
          else
            regions="us"
          fi
          echo "regions=${regions}" >> "$GITHUB_OUTPUT"
          echo "pr-rom-gate: versions to build: ${regions:-none}" >&2

      - name: Build and compare against the retail checksum
        if: steps.coverage-only.outputs.skip != 'true'
        shell: bash
        env:
          GATE_REGIONS: ${{ steps.regions.outputs.regions }}
          GATE_REQUIRE_ALL_REGIONS: ${{ vars.GATE_REQUIRE_ALL_REGIONS || '0' }}
          POKESTADIUM_BASEROM_DIR: ${{ vars.POKESTADIUM_BASEROM_DIR }}
          POKESTADIUM_REGION_CACHE_DIR: ${{ vars.POKESTADIUM_REGION_CACHE_DIR }}
        run: bash ci/gate-pr.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pokestadium-gate-out"

      - name: Upload gate and proposed coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pr-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
          path: ${{ runner.temp }}/pokestadium-gate-out/
          if-no-files-found: warn
          retention-days: 14
