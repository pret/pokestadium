  - name: header
    type: header
    start: 0x0
    vram: 0
    subsegments:
    - [0x0, header, header]
  - name: boot
    type: code
    start: 0x40
    vram: 0xA4000040
    subsegments:
    - [0x40, hasm, boot]
    - [0xB70, bin, bootcode_font]
